<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON OVERDRIVE: SYNDICATE MAP</title>
    <style>
        :root { --neon: #00f2ff; --gold: #ffcc00; --red: #ff0044; --glass: rgba(10, 10, 25, 0.9); }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Orbitron', sans-serif; touch-action: none; color: white; }
        
        /* UI OVERHAUL */
        #menu { position: absolute; inset: 0; background: radial-gradient(circle at center, #001a1a, #000); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; }
        .btn { width: 280px; padding: 15px; margin: 10px; border: 2px solid var(--neon); background: transparent; color: var(--neon); font-family: 'Orbitron'; cursor: pointer; font-weight: 900; letter-spacing: 2px; }
        
        #hud { position: absolute; top: 0; width: 100%; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; pointer-events: none; z-index: 1000; }
        .gauge-row { display: flex; gap: 15px; margin-bottom: 10px; }
        .gauge { background: var(--glass); border-left: 4px solid var(--neon); padding: 8px 15px; font-size: 0.9rem; }

        /* MINI-MAP */
        #minimap-container { position: absolute; top: 20px; right: 20px; width: 150px; height: 150px; background: rgba(0,0,0,0.7); border: 2px solid var(--neon); border-radius: 10px; overflow: hidden; z-index: 1100; }
        #minimap-canvas { width: 100%; height: 100%; }

        #boss-bar { position: absolute; top: 120px; left: 50%; transform: translateX(-50%); width: 70%; display: none; text-align: center; }
        #boss-hp { width: 100%; height: 8px; background: #200; border: 1px solid var(--red); margin-top: 5px; }
        #boss-fill { width: 100%; height: 100%; background: var(--red); }

        #controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; z-index: 1500; }
        .joy-btn { width: 75px; height: 75px; background: var(--glass); border: 2px solid var(--neon); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        #fire-btn { width: 110px; height: 110px; border-color: var(--red); color: var(--red); font-weight: 900; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="menu">
        <h1 style="color: var(--neon); font-size: 3rem; text-shadow: 0 0 15px var(--neon);">NEON OVERDRIVE</h1>
        <button class="btn" onclick="startGame()">INITIALIZE DRIVE</button>
        <p style="font-size: 0.7rem; color: var(--gold);">LOCATE THE PURPLE MARKER FOR THE BOSS</p>
    </div>

    <div id="hud">
        <div class="gauge-row">
            <div class="gauge">KM/H: <span id="kmh">0</span></div>
            <div class="gauge" style="border-color: var(--red)">HP: <span id="hp-val">100</span>%</div>
        </div>
        <div class="gauge" style="border-color: var(--gold); width: fit-content;">CR: <span id="score-val">0</span></div>
    </div>

    <div id="minimap-container">
        <canvas id="minimap-canvas"></canvas>
    </div>

    <div id="boss-bar">
        <span style="color: var(--red); font-size: 0.6rem;">BOSS: THE DREADNOUGHT</span>
        <div id="boss-hp"><div id="boss-fill"></div></div>
    </div>

    <div id="controls">
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
            <div></div><div class="joy-btn" id="up-btn">▲</div><div></div>
            <div class="joy-btn" id="l-btn">◀</div><div class="joy-btn" id="down-btn">▼</div><div class="joy-btn" id="r-btn">▶</div>
        </div>
        <div class="joy-btn" id="fire-btn">FIRE</div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        let scene, camera, renderer, player, mapCtx;
        let active = false, score = 0, hp = 100, vel = 0, rot = 0;
        let bossHp = 3000, isBossActive = false;

        const inputs = { up: false, down: false, left: false, right: false };
        const bullets = [], enemies = [], buildings = [];
        
        const missions = [
            { id: 'bank', color: '#ffcc00', x: 200, z: -200 },
            { id: 'boss', color: '#ff00ff', x: -300, z: -350 }
        ];

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const mapCanvas = document.getElementById('minimap-canvas');
            mapCtx = mapCanvas.getContext('2d');
            mapCanvas.width = 150; mapCanvas.height = 150;

            // Lights
            scene.add(new THREE.AmbientLight(0xffffff, 0.3));
            const light = new THREE.PointLight(0x00f2ff, 2, 500);
            scene.add(light);

            // Objects
            createPlayer();
            createEnvironment();
            setupControls();
        }

        function createPlayer() {
            player = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.7, 4), new THREE.MeshStandardMaterial({ color: 0x111111 }));
            const glow = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.1, 4.1), new THREE.MeshBasicMaterial({ color: 0x00f2ff }));
            glow.position.y = -0.3;
            player.add(body, glow);
            scene.add(player);
        }

        function createEnvironment() {
            scene.add(new THREE.GridHelper(2000, 100, 0x00f2ff, 0x050505));
            for(let i=0; i<80; i++) {
                const h = 20 + Math.random()*60;
                const b = new THREE.Mesh(new THREE.BoxGeometry(12, h, 12), new THREE.MeshStandardMaterial({ color: 0x050505, emissive: 0x00f2ff, emissiveIntensity: 0.1 }));
                b.position.set((Math.random()-0.5)*1000, h/2, (Math.random()-0.5)*1000);
                if(b.position.length() > 40) { scene.add(b); buildings.push(b); }
            }
        }

        function updateMiniMap() {
            mapCtx.clearRect(0,0,150,150);
            mapCtx.fillStyle = '#000'; mapCtx.fillRect(0,0,150,150);
            
            const zoom = 0.15;
            const centerX = 75; const centerZ = 75;

            // Draw Missions
            missions.forEach(m => {
                mapCtx.fillStyle = m.color;
                mapCtx.beginPath();
                mapCtx.arc(centerX + (m.x - player.position.x)*zoom, centerZ + (m.z - player.position.z)*zoom, 4, 0, Math.PI*2);
                mapCtx.fill();
            });

            // Draw Player (Fixed center)
            mapCtx.fillStyle = '#00f2ff';
            mapCtx.save();
            mapCtx.translate(centerX, centerZ);
            mapCtx.rotate(-player.rotation.y);
            mapCtx.fillRect(-3, -5, 6, 10);
            mapCtx.restore();
        }

        function shoot() {
            const b = new THREE.Mesh(new THREE.SphereGeometry(0.5), new THREE.MeshBasicMaterial({ color: 0x00f2ff }));
            b.position.copy(player.position);
            b.userData.vel = new THREE.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y)).multiplyScalar(5);
            scene.add(b);
            bullets.push(b);
        }

        function update() {
            // Physics
            if(inputs.up) vel += 0.08;
            if(inputs.down) vel -= 0.06;
            vel *= 0.96;
            
            if(Math.abs(vel) > 0.1) {
                const turnStr = inputs.left ? 0.04 : (inputs.right ? -0.04 : 0);
                rot += turnStr;
            }
            player.rotation.y = rot;
            
            player.position.x += Math.sin(rot) * vel;
            player.position.z += Math.cos(rot) * vel;

            // Bullet logic
            bullets.forEach((b, i) => {
                b.position.add(b.userData.vel);
                if(b.position.distanceTo(new THREE.Vector3(-300, 0, -350)) < 20) {
                    bossHp -= 50;
                    document.getElementById('boss-fill').style.width = (bossHp/3000)*100 + "%";
                    scene.remove(b); bullets.splice(i,1);
                }
            });

            // Boss Proximity
            const distToBoss = player.position.distanceTo(new THREE.Vector3(-300, 0, -350));
            if(distToBoss < 100) {
                isBossActive = true;
                document.getElementById('boss-bar').style.display = 'block';
            }

            // Camera
            const camPos = player.position.clone().add(new THREE.Vector3(0, 18, -28).applyAxisAngle(new THREE.Vector3(0,1,0), rot));
            camera.position.lerp(camPos, 0.1);
            camera.lookAt(player.position);

            updateMiniMap();
            document.getElementById('kmh').innerText = Math.floor(Math.abs(vel)*150);
            document.getElementById('hp-val').innerText = hp;
            if(bossHp <= 0) { alert("SYNDICATE DESTROYED!"); location.reload(); }
        }

        function setupControls() {
            const bind = (id, k, v) => {
                const el = document.getElementById(id);
                el.ontouchstart = (e) => { e.preventDefault(); inputs[k] = v; };
                el.ontouchend = () => inputs[k] = !v;
            };
            bind('up-btn', 'up', true); bind('down-btn', 'down', true);
            bind('l-btn', 'left', true); bind('r-btn', 'right', true);
            document.getElementById('fire-btn').ontouchstart = (e) => { e.preventDefault(); shoot(); };
        }

        window.startGame = () => { active = true; document.getElementById('menu').style.display = 'none'; };
        function animate() { requestAnimationFrame(animate); if(active) update(); renderer.render(scene, camera); }
        init(); animate();
    </script>
</body>
</html>
